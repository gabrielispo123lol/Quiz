ns and valves", "Liver contractions", "Nerve impulses alone"], 1, "Movement depends largely on muscles and one-way valves."], ["The spleen primarily filters:", ["Lymph", "Blood", "Urine", "Bile"], 1, "The spleen filters blood."], ["Where are lymphocytes produced?", ["Bone marrow", "Pancreas", "Skin", "Lungs"], 0, "Bone marrow produces lymphocytes."], ["What is edema?", ["Low blood sugar", "Excess tissue fluid swelling", "Low oxygen", "Bone loss"], 1, "Edema is swelling caused by fluid accumulation."], ["Which duct drains most of the body?", ["Cystic duct", "Thoracic duct", "Bile duct", "Pancreatic duct"], 1, "The thoracic duct drains most lymph."], ["The right lymphatic duct drains lymph from the:", ["Entire body", "Lower body only", "Upper right portion of body", "Digestive tract only"], 2, "It drains the upper right quadrant."], ["Tonsils help protect against pathogens entering through the:", ["Skin", "Mouth and nose", "Kidneys", "Bones"], 1, "Tonsils monitor inhaled and ingested pathogens."], ["What type of immunity results from vaccination?", ["Artificial active immunity", "Natural passive immunity", "Artificial passive immunity", "Innate immunity"], 0, "Vaccines stimulate active immune memory."], ["What are pathogens?", ["Hormones", "Disease-causing organisms", "Nutrients", "Enzymes"], 1, "Pathogens cause disease."], ["Which vessel type has one-way valves?", ["Lymphatic vessels", "Capillaries only", "Alveoli", "Arteries only"], 0, "Valves prevent lymph backflow."], ["What is the function of macrophages?", ["Carry oxygen", "Destroy pathogens", "Clot blood", "Produce insulin"], 1, "Macrophages engulf and digest foreign material."], ["The thymus is largest during:", ["Childhood", "Old age", "Middle age", "Never"], 0, "The thymus is most active in childhood."], ["Lymph originates from:", ["Synovial fluid", "Interstitial fluid", "Cerebrospinal fluid", "Bile"], 1, "Lymph begins as tissue fluid."], ["What network transports lymph?", ["Nervous system", "Lymphatic vessels", "Digestive tract", "Muscles"], 1, "Lymphatic vessels transport lymph."], ["Swollen lymph nodes often indicate:", ["Immune activity", "Bone fracture", "Dehydration only", "Diabetes"], 0, "They often enlarge during infection."], ["Which organ removes old red blood cells?", ["Spleen", "Thymus", "Tonsils", "Appendix"], 0, "The spleen removes worn-out RBCs."], ["What kind of immunity is present at birth?", ["Adaptive", "Innate", "Artificial", "Acquired"], 1, "Innate immunity is present from birth."], ["What is the role of the appendix in immunity?", ["Stores immune tissue", "Pumps lymph", "Produces bile", "Filters urine"], 0, "The appendix contains lymphoid tissue."], ["What are clusters of lymphatic tissue in the small intestine called?", ["Peyer patches", "Glomeruli", "Alveoli", "Ganglia"], 0, "Peyer patches help monitor intestinal pathogens."], ["Which immunity develops after infection?", ["Active immunity", "Passive immunity", "Artificial immunity", "Congenital immunity"], 0, "Exposure can create active immunity."], ["Which white blood cell engulfs bacteria?", ["Macrophage", "Erythrocyte", "Platelet", "Fibroblast"], 0, "Macrophages perform phagocytosis."], ["What is the purpose of lymphatic capillaries?", ["Collect excess tissue fluid", "Pump blood", "Digest fats", "Store oxygen"], 0, "They collect fluid from tissues."], ["Which organ is not considered lymphatic?", ["Spleen", "Thymus", "Tonsils", "Gallbladder"], 3, "The gallbladder is digestive."], ["What does the immune system recognize as foreign?", ["Antigens", "Vitamins", "Hormones", "Minerals"], 0, "Antigens trigger immune responses."], ["What cells become plasma cells?", ["B cells", "T cells", "Neurons", "Platelets"], 0, "Activated B cells become antibody-producing plasma cells."], ["What is lymphadenopathy?", ["Enlarged lymph nodes", "Bone disease", "Lung disease", "Liver inflammation"], 0, "Lymphadenopathy means enlarged nodes."], ["Where are Peyer patches located?", ["Small intestine", "Lung", "Heart",
